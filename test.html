<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار HTML و CSS فقط</title>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0c0c0c; /* خلفية سوداء داكنة */
            color: #ffffff;
            line-height: 1.6;
            direction: rtl;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .test-box {
            background: red !important;
            border: 5px solid yellow !important;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }
        h1 {
            color: #8b5cf6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>هذه صفحة اختبار HTML و CSS فقط</h1>
        <p>إذا رأيت هذا النص داخل مربع أحمر ذي حدود صفراء، فهذا يعني أن HTML و CSS يعملان بشكل صحيح.</p>
        
        <div class="test-box">
            <h2>هذا هو مربع الاختبار</h2>
            <p>المشكلة إذا لم يظهر هذا المربع بالشكل الصحيح هي في المتصفح أو في كيفية حفظ الملف.</p>
        </div>
    </div>

</body>
</html>
